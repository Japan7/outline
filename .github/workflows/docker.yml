name: Publish build

on:
  push:
    branches:
      - "main"
      - "oidc-groups"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    with:
      registry: ghcr.io
      image-name: japan7/outline
      base-image-name: japan7/outline-base
      tags: |
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
