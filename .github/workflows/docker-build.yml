name: Docker build

# Reusable multi-arch build and publish pipeline. Callers supply the ref to
# build and the docker/metadata-action tag rules to publish under.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build. Defaults to the ref that triggered the caller.
        type: string
        required: false
        default: ""
      registry:
        description: Registry to publish to, e.g. docker.io or ghcr.io.
        type: string
        required: false
        default: docker.io
      image-name:
        description: Image name (without registry) for the application image.
        type: string
        required: false
        default: outlinewiki/outline
      base-image-name:
        description: Image name (without registry) for the base image.
        type: string
        required: false
        default: outlinewiki/outline-base
      tags:
        description: docker/metadata-action tag rules.
        type: string
        required: true
      flavor:
        description: docker/metadata-action flavor rules.
        type: string
        required: false
        default: ""
      environment:
        description: Environment used to gate publishing of the manifest.
        type: string
        required: false
        default: dockerhub

env:
  IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}
  BASE_IMAGE: ${{ inputs.registry }}/${{ inputs.base-image-name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker base meta
        id: base_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.BASE_IMAGE }}
          flavor: ${{ inputs.flavor }}
          tags: ${{ inputs.tags }}

      - name: Login to Docker Hub
        if: inputs.registry != 'ghcr.io'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        id: base_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          labels: ${{ steps.base_meta.outputs.labels }}
          tags: ${{ env.BASE_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          pull: false

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
          flavor: ${{ inputs.flavor }}
          tags: ${{ inputs.tags }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          pull: false
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}@${{ steps.base_build.outputs.digest }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs:
      - build
    environment: ${{ inputs.environment }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        if: inputs.registry != 'ghcr.io'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: ${{ inputs.flavor }}
          tags: ${{ inputs.tags }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # word splitting is intentional here
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
